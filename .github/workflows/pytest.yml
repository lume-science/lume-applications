name: pytest

on:
  pull_request:
  workflow_dispatch:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  delete-cancelled-runs:
    permissions:
      actions: write
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'MercuryTechnologies/delete-cancelled-runs@1.0.0'
        with:
          workflow-file: 'pytest.yml'
          max-deletions: 1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pre-commit checks
        env:
          RUFF_OUTPUT_FORMAT: github
        run: |
          uv run pre-commit run --all-files

      - name: Run pytest
        run: |
          uv run pytest lume_applications/tests/ -v
